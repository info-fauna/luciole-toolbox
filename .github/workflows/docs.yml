name: Docs

on:
  workflow_dispatch:
  workflow_call: # reused by release.yml to build the site it deploys
    inputs:
      upload:
        description: Upload the built site as a Pages artifact
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ".[docs]"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: inputs.upload
        with:
          path: site
