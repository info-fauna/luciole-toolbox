name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -m "not integration"
      - name: Coverage summary
        if: matrix.python-version == '3.12'
        env:
          COVERAGE_THRESHOLD: 85
        run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          total=$(coverage report --format=total)
          if [ "$total" -lt "$COVERAGE_THRESHOLD" ]; then
            echo "::warning title=Low coverage::Coverage is ${total}%, below the ${COVERAGE_THRESHOLD}% threshold"
          fi

  ci-status:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - run: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'exit 1' || 'exit 0' }}
