[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "luciole-toolbox"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Kim Biloni", email = "kim.biloni@infofauna.ch" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyproj>=3.6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/luciole_toolbox/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/luciole_toolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits a real network endpoint (swisstopo API, pyproj CDN grid shift files) - excluded via -m 'not integration'",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
